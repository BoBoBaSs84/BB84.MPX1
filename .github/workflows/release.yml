name: Continuous Deployment

# Pushing a tag such as v1.0.0 builds and tests on Windows and Linux, packages the Native AOT win-x64 zip and the
# linux-x64 AppImage and Flatpak bundle, and creates the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: BB84.MPX1.slnx
  CONFIGURATION: Release

jobs:
  package:
    name: Build and Package (${{ matrix.rid }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        # Native AOT cannot cross-compile between operating systems.
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version from tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution
        shell: pwsh
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore -p:Version=$env:VERSION

      # Exit code 8 = no tests found; allowed while projects are still empty.
      # Hardware tests need a real MPX 1 and never run in CI.
      - name: Run tests
        run: dotnet test --solution ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-build -- --ignore-exit-code 8 --filter "TestCategory!=Hardware" --report-trx --results-directory ${{ github.workspace }}/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.rid }}
          path: test-results/*.trx

      # The Native AOT linker on Linux needs clang and zlib; the Flatpak bundle needs flatpak-builder and Flathub.
      # Ubuntu 24.04+ blocks the unprivileged user namespaces that flatpak-builder's bubblewrap sandbox uses.
      - name: Install Linux packaging prerequisites
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq clang zlib1g-dev flatpak flatpak-builder
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Package (Native AOT, ${{ matrix.rid }})
        shell: pwsh
        run: ./build/package.ps1 -Version $env:VERSION -Runtime ${{ matrix.rid }}

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.rid }}
          path: |
            artifacts/release/*.zip
            artifacts/release/*.AppImage
            artifacts/release/*.flatpak
            artifacts/release/*.sha256
            artifacts/release/release-notes.md

  release:
    name: Create GitHub Release
    needs: package
    runs-on: ubuntu-latest

    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          $files = @(
            "dist/BB84.MPX1-$version-win-x64.zip"
            "dist/BB84.MPX1-$version-x86_64.AppImage"
            "dist/BB84.MPX1-$version-x86_64.flatpak"
          )
          $files += $files | ForEach-Object { "$_.sha256" }
          $files | ForEach-Object { if (-not (Test-Path $_)) { throw "$_ is missing." } }
          $pre = if ($version -like '*-*') { '--prerelease' } else { $null }
          gh release create '${{ github.ref_name }}' $files `
            --title "BB84.MPX1 $version" --notes-file dist/release-notes.md --verify-tag $pre
