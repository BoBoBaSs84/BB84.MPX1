name: Continuous Deployment

# Pushing a tag such as v1.0.0 builds, tests, publishes the Native AOT win-x64 build and creates the GitHub Release.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: BB84.MPX1.slnx
  CONFIGURATION: Release

jobs:
  release:
    name: Build and Publish
    runs-on: windows-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Version from tag
        shell: pwsh
        run: |
          $version = '${{ github.ref_name }}'.TrimStart('v')
          "VERSION=$version" >> $env:GITHUB_ENV

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore -p:Version=$env:VERSION

      # Exit code 8 = no tests found; allowed while projects are still empty.
      # Hardware tests need a real MPX 1 and never run in CI.
      - name: Run tests
        run: dotnet test --solution ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-build -- --ignore-exit-code 8 --filter "TestCategory!=Hardware" --report-trx --results-directory ${{ github.workspace }}/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: test-results/*.trx

      - name: Package (Native AOT, win-x64)
        shell: pwsh
        run: ./build/package.ps1 -Version $env:VERSION

      - name: Create GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $zip = "artifacts/release/BB84.MPX1-$env:VERSION-win-x64.zip"
          $pre = if ($env:VERSION -like '*-*') { '--prerelease' } else { $null }
          gh release create '${{ github.ref_name }}' $zip "$zip.sha256" `
            --title "BB84.MPX1 $env:VERSION" --notes-file artifacts/release/release-notes.md --verify-tag $pre
