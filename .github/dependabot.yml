# Dependabot configuration.
# Version updates run weekly and are grouped per package family. Major bumps
# get their own PR. Security updates are not affected by the schedule and
# arrive right away.
version: 2

updates:
  # NuGet packages (Directory.Packages.props) and local tools (.config/dotnet-tools.json).
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    open-pull-requests-limit: 10
    assignees: ["BoBoBaSs84"]
    labels: ["dependencies", "nuget"]
    commit-message:
      prefix: "chore(deps)"
      include: "scope"
    ignore:
      # The .NET major line (10 -> 11) moves together with the SDK and TFM, so it is done by hand.
      - dependency-name: "Microsoft.*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Avalonia.*"
        update-types: ["version-update:semver-major"]
    groups:
      microsoft:
        patterns:
          - "Microsoft.*"
        update-types: ["minor", "patch"]
      avalonia:
        patterns:
          - "Avalonia.*"
        update-types: ["minor", "patch"]
      nuget-other:
        patterns: ["*"]
        update-types: ["minor", "patch"]
      security:
        applies-to: "security-updates"
        patterns: ["*"]

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "05:00"
      timezone: "Europe/Berlin"
    assignees: ["BoBoBaSs84"]
    labels: ["dependencies", "github-actions"]
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]
