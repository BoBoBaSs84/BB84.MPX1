name: Continuous Integration

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  SOLUTION: BB84.MPX1.slnx
  CONFIGURATION: Release

jobs:
  build:
    name: Build and Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # WinMM tests skip themselves on Linux. Native AOT cannot cross-compile, so each OS publishes its own runtime.
        include:
          - os: windows-latest
            rid: win-x64
          - os: ubuntu-latest
            rid: linux-x64
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION }}

      - name: Build solution
        run: dotnet build ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-restore

      # The ALSA loopback tests need the sequencer and its Midi Through port; without them they are inconclusive.
      - name: Load ALSA sequencer (best effort)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          if sudo apt-get install -y -qq libasound2t64 "linux-modules-extra-$(uname -r)" && sudo modprobe snd-seq-dummy; then
            sudo chmod a+rw /dev/snd/seq
          else
            echo "ALSA sequencer unavailable; the Alsa tests will be inconclusive."
          fi

      # Exit code 8 = no tests found; allowed while projects are still empty.
      # Hardware tests need a real MPX 1 and never run in CI.
      - name: Run tests
        run: dotnet test --solution ${{ env.SOLUTION }} --configuration ${{ env.CONFIGURATION }} --no-build -- --ignore-exit-code 8 --filter "TestCategory!=Hardware" --report-trx --results-directory ${{ github.workspace }}/test-results

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-${{ matrix.os }}
          path: test-results/*.trx

      # The Native AOT linker on Linux needs clang and zlib.
      - name: Install AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get install -y -qq clang zlib1g-dev

      - name: Publish (Native AOT, ${{ matrix.rid }})
        run: dotnet publish src/BB84.MPX1.App --configuration ${{ env.CONFIGURATION }} -r ${{ matrix.rid }} -o artifacts/publish

      # A Native AOT publish leaves no managed app assembly behind.
      - name: Verify Native AOT output
        shell: pwsh
        run: if (Test-Path artifacts/publish/BB84.MPX1.App.dll) { throw "Publish is not Native AOT." }

      - name: Upload publish results
        uses: actions/upload-artifact@v7
        with:
          name: BB84.MPX1-${{ matrix.rid }}
          path: |
            artifacts/publish/BB84.MPX1
            artifacts/publish/*.exe
            artifacts/publish/*.dll
            artifacts/publish/*.so
